<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .banner{
    width:1280px;height:640px;box-sizing:border-box;
    background:linear-gradient(135deg,#1b2a5e 0%,#234794 55%,#2b57ad 100%);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    position:relative;overflow:hidden;
  }
  .stroke{
    position:absolute;left:0;top:300px;width:1280px;height:56px;
    background:linear-gradient(90deg,rgba(12,20,48,.55) 0%,rgba(12,20,48,.35) 45%,rgba(12,20,48,0) 85%);
    border-radius:0 28px 28px 0;
  }
  .brand{
    position:absolute;left:64px;top:48px;width:220px;height:auto;
  }
  .name{
    position:relative;color:#ffffff;font-size:168px;font-weight:300;
    letter-spacing:.04em;line-height:1;margin:0 0 34px;
  }
  .name b{font-weight:700}
  .tagline{
    position:relative;color:#dfe7fa;font-size:44px;font-weight:400;
    letter-spacing:.12em;margin:0;
  }
  .sub{
    position:relative;color:#9db1e4;font-size:26px;letter-spacing:.28em;
    margin:26px 0 0;text-transform:uppercase;
  }
</style>
<div class="banner">
  <img class="brand" src="kitepon-dev-on-night.png" alt="kitepon.dev">
  <div class="stroke"></div>
  <p class="name"><b>un</b>ai</p>
  <p class="tagline">日本語からAIっぽさを取り除く</p>
  <p class="sub">un-AI Japanese writing</p>
</div>
