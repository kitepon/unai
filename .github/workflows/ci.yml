name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify product-owned CI
        run: node --test tests/ci-contract.test.mjs

  full:
    uses: ./.github/workflows/product-full-ci.yml
