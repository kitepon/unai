name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and installer syntax
        run: |
          jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json
          bash -n install.sh
      - name: Exercise local installer without changing the runner home
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          mkdir -p "$test_home"/{.claude,.codex,.agents,.grok,.cursor}
          HOME="$test_home" bash install.sh
          for host in .claude .codex .agents .grok .cursor; do
            test -L "$test_home/$host/skills/unai"
            test -f "$test_home/$host/skills/unai/SKILL.md"
          done
